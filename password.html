<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worst UI Login – Password</title>
    <style>
        body {
            font-family: 'Impact', 'Arial', cursive;
            background: linear-gradient(135deg, #8B4513, #696969, #9ACD32);
            color: #FFFF99;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-family: 'Brush Script MT', cursive;
            color: #DC143C;
            font-size: 2.5rem;
            text-shadow: 3px 3px 0px #FFFF99;
            text-align: center;
            animation: pulse 3s infinite;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #instructions {
            background: #B0E0E6;
            color: #8B4513;
            padding: 15px;
            text-align: center;
            border: 3px dashed #DC143C;
            margin: 20px auto;
            max-width: 600px;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            border-radius: 10px;
        }

        button {
            background: #9ACD32;
            color: #8B4513;
            border: 5px solid #DC143C;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Impact', sans-serif;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #FFFF99;
            transform: scale(1.1);
        }

        canvas {
            border: 5px solid #DC143C;
            background: #FFFF99;
            padding-left: 0;
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 0 20px #8B4513;
        }

        #input {
            background: #696969;
            color: #FFFF99;
            padding: 20px;
            margin: 20px auto;
            font-size: 1.5rem;
            border: 3px solid #DC143C;
            text-align: center;
            border-radius: 10px;
            max-width: 600px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        #confirm-section {
            margin-top: 30px;
            text-align: center;
        }

        #proceed-btn {
            background: #9ACD32;
            color: #8B4513;
            border: 5px solid #DC143C;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Impact', sans-serif;
            cursor: pointer;
            margin: 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        #proceed-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body onmousedown="mouseDown(event);" onmouseup="mouseUp(event);" onmousemove="mouseMove(event);">
    <h1>Enter your totally secure password :D !</h1>
    <div id="instructions">Well move around and find out for yourself</div>
    
    <button onclick="typeSelected();">TYPE</button>
    <canvas id="canvas" width="900px" height="480px"></canvas>
    <p id="input">Eyes down here sir!</p>

    <div id="confirm-section">
        <button id="proceed-btn">PROCEED →</button>
    </div>

    <script>
        const BACKSPACE = "\u2190";
        const ENTER = "\u21B5";

        function distance(x1, y1, x2, y2) {
            var distX = x1 - x2;
            var distY = y1 - y2;
            return Math.sqrt(distX*distX + distY*distY);
        }

        function clamp(val, min, max) {
            return Math.min(max, Math.max(min, val));
        }


        function Segment(x1, y1, x2, y2) {
            this.x1 = Math.min(x1, x2);
            this.y1 = Math.min(y1, y2);
            this.x2 = Math.max(x1, x2);
            this.y2 = Math.max(y1, y2);
        }

        Segment.prototype.drawOuter = function() {
            ctx.strokeRect(this.x1-5.5, this.y1-5.5, this.x2-this.x1+11, this.y2-this.y1+11);
        };

        Segment.prototype.drawInner = function() {
            ctx.fillStyle = "#EEEEEE";
            ctx.fillRect(this.x1-5, this.y1-5, this.x2-this.x1+10, this.y2-this.y1+10);
        };

        Segment.prototype.getClosestPoint = function(x, y) {
            if (this.x1 === this.x2) {
                return {"x": this.x1, "y": clamp(y, this.y1, this.y2)};
            } else {
                return {"x": clamp(x, this.x1, this.x2), "y": this.y1};
            }
        };

        function Letter(char, x, y, below) {
            this.char = char;
            this.x = x;
            this.y = y;
            segments.push(new Segment(x, y - (below ? 50 : 0), x, y + (below ? 0 : 50)));
        }

        Letter.prototype.draw = function() {
            if (this.char == ENTER) {
                ctx.fillStyle = "#00FF00";
            } else if (this.char == BACKSPACE) {
                ctx.fillStyle = "#FF0000";
            } else {
                ctx.fillStyle = "#EEEEEE";
            }
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "#000000";
            ctx.fillText(this.char, this.x, this.y);
        };
        Letter.prototype.radius = 20;

        function prepareLetters() {
            var chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ,.?!_-'".split("");
            chars.push(BACKSPACE, ENTER);
            for (let i = 0; i < 71; i++) {
                let randomIndex = i + Math.floor(Math.random()*(72-i));
                [chars[i], chars[randomIndex]] = [chars[randomIndex], chars[i]];
            }
            return chars;
        }

        /*
         * Stick
         */

        function Stick(x, y) {
            this.x = x;
            this.y = y;
            this.draw();
        }

        Stick.prototype.draw = function() {
            ctx.fillStyle = "#555555";
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
            ctx.fill();
        };

        Stick.prototype.moveToClosestPoint = function(x, y) {
            var closestPoint = {"x": Infinity, "y": Infinity};
            var leastDistance = Infinity;
            for (let segment of segments) {
                var closestInSegment = segment.getClosestPoint(x, y);
                var dist = distance(x, y, closestInSegment.x, closestInSegment.y);
                if (dist < leastDistance) {
                    closestPoint = closestInSegment;
                    leastDistance = dist;
                }
            }
            Object.assign(stick, closestPoint);
            if (leastDistance > 0) {
                ctx.putImageData(backgroundImage, 0, 0);
            }
            this.draw();
        };

        Stick.prototype.radius = 25;

        /*
         * Other
         */

        function mouseDown(event) {
            var rect = canvas.getBoundingClientRect();
            var x = event.clientX - rect.left;
            var y = event.clientY - rect.top;
            var dist = distance(x, y, stick.x, stick.y);
            if (dist < stick.radius) {
                isDragging = true;
                stick.moveToClosestPoint(x, y);
            }
        }

        function mouseMove(event) {
            if (isDragging) {
                var rect = canvas.getBoundingClientRect();
                var x = event.clientX - rect.left;
                var y = event.clientY - rect.top;
                var dist = distance(x, y, stick.x, stick.y);
                if (dist < stick.radius+5) {
                    stick.moveToClosestPoint(x, y);
                }
            }
        }

        function mouseUp(event) {
            if (isDragging) {
                isDragging = false;
                for (let letter of letters) {
                    if (distance(stick.x, stick.y, letter.x, letter.y) < 10) {
                        selectedChar = letter.char;
                        return;
                    }
                }
                selectedChar = "";
            }
        }

        function typeSelected() {
            if (selectedChar == "") {
                return;
            } else if (selectedChar == BACKSPACE) {
                writtenChars.pop();
            } else if (selectedChar == ENTER) {
                return;
            } else {
                writtenChars.push(selectedChar);
            }

            input.innerHTML = writtenChars.join('');
            setTimeout(() => {
                input.innerHTML = writtenChars.map(() => '*').join('');
            }, 5000);
        }

        function drawBackground() {
            for (let segment of segments) {
                segment.drawOuter();
            }
            for (let segment of segments) {
                segment.drawInner();
            }
            for (let letter of letters) {
                letter.draw();
            }
            return ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        // Password confirmation logic
        const proceedBtn = document.getElementById("proceed-btn");

        proceedBtn.addEventListener("click", function() {
            window.location.href = 'captcha2.html';
        });

        // Initialize everything
        const info = document.getElementById("info");
        const input = document.getElementById("input");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        ctx.font = "24px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const segments = [
            new Segment(36, 81, 864, 81),
            new Segment(36, 243, 864, 243),
            new Segment(36, 405, 864, 405),
            new Segment(450, 81, 450, 405)
        ];
        const shuffledLetters = prepareLetters();
        const letters = [];
        for (let i = 0; i < 72; i++) {
            let y = Math.floor(i/12);
            let x = i % 12;
            let shaft = Math.floor(y/2);
            let below = y % 2 === 1;
            letters.push(new Letter(shuffledLetters[i], 72*x + (x < 6 ? 36 : 72), 162*shaft + (below ? 126 : 36), below));
        }
        var writtenChars = [];
        var selectedChar = letters[0].char;
        const backgroundImage = drawBackground();
        const stick = new Stick(36, 36);
        var isDragging = false;
    </script>
</body>
</html>
