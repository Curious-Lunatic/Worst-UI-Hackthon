<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worst UI Login – Phone Number</title>
    <style>
        body {
            font-family: 'Impact', 'Arial', cursive;
            background: linear-gradient(135deg, #9ACD32, #B0E0E6, #FFFF99);
            color: #8B4513;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-family: 'Impact', sans-serif;
            color: #DC143C;
            font-size: 2.8rem;
            text-shadow: 3px 3px 0px #FFFF99;
            text-align: center;
            animation: shake 2s infinite;
            margin-bottom: 10px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        #instructions {
            background: #696969;
            color: #FFFF99;
            padding: 15px;
            text-align: center;
            border: 3px dashed #DC143C;
            margin: 20px auto;
            max-width: 600px;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
        }

        form {
            background: linear-gradient(45deg, #B0E0E6, #FFFF99);
            border: 5px solid #DC143C;
            border-radius: 15px;
            padding: 30px;
            margin: 20px;
            box-shadow: 0 0 20px #8B4513;
            max-width: 500px;
            width: 100%;
        }

        h3 {
            color: #DC143C;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #FFFF99;
        }

        #phoneDisplay {
            background: #9ACD32;
            color: #8B4513;
            padding: 15px;
            border: 3px solid #DC143C;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
        }

        input#slider {
            width: 100%;
            height: 30px;
            background: #FFFF99;
            border: 3px solid #DC143C;
            transition: all 0.5s ease-in-out;
            margin: 20px 0;
            cursor: grab;
        }

        input#slider:active {
            cursor: grabbing;
        }

        input#angleSlider {
            width: 100%;
            height: 20px;
            background: #9ACD32;
            border: 2px solid #8B4513;
            margin: 10px 0;
        }

        #advancedMode {
            transform: scale(1.5);
            margin-right: 10px;
        }

        label {
            font-size: 1.2rem;
            color: #8B4513;
            font-weight: bold;
        }

        #submit {
            background: #DC143C;
            color: #FFFF99;
            border: 5px solid #8B4513;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Impact', sans-serif;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        #submit:hover {
            background: #9ACD32;
            color: #8B4513;
            transform: scale(1.1);
        }

        hr {
            border: 2px solid #DC143C;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>GIVE US YOUR NUMBER !!!</h1>
    <div id="instructions">Try the advanced mode if you are struggling ;)</div>
    
    <form>
        <h3>Phone Number Selector</h3>
        <div id="phoneDisplay">9876543210</div>
        <input id="slider" type="range" min="1000000000" max="9999999999" value="9876543210" title="Hint: use keyboard arrows to change value">
        
        <hr>
        
        <div>
            <input id="advancedMode" type="checkbox">
            <label for="advancedMode">Advanced Mode</label>
            <input id="angleSlider" type="range" min="-10" max="10" step="0.02" style="display: none;" value="0">
        </div>
        
        <input id="submit" type="submit" value="CONFIRM NUMBER">
    </form>

    <button onclick="location.href='password.html'" style="background: #9ACD32; color: #8B4513; border: 5px solid #DC143C; padding: 15px 30px; font-size: 1.5rem; font-family: 'Impact', sans-serif; cursor: pointer; margin: 20px; border-radius: 10px;">
        PROCEED →
    </button>

    <script>
        var slider = document.getElementById("slider");
        var angleSlider = document.getElementById("angleSlider");
        var phoneDisplay = document.getElementById("phoneDisplay");
        var advancedModeCheckbox = document.getElementById("advancedMode");
        var angle = 0;
        var speed = 0;
        var friction = 0.99;
        var value = Number(slider.value);
        
        function PhoneNumberToDisplay(value) {
            var phoneStr = value.toString().padStart(10, '0');
            var display = phoneStr.substr(0, 5) + '-' + phoneStr.substr(5, 5);
            return display;
        }
        
        function UpdatePhone() {
            angle = Number(angleSlider.value);
            value = Number(slider.value);
            
            speed += Math.sin(angle * Math.PI / 180) * 1000;
            // Friction
            speed *= friction;
            value += Math.round(speed * 100000);
            
            if (value > slider.max) {
                value = slider.max;
                speed *= -1;
            } else if (value < slider.min) {
                value = slider.min;
                speed *= -1;
            }
            
            slider.value = value;
            phoneDisplay.innerHTML = PhoneNumberToDisplay(value);
        }

        setInterval(UpdatePhone, 10);
        
        // Advanced Mode toggle
        advancedModeCheckbox.addEventListener("change", function() {
            if (this.checked) {
                document.getElementById("angleSlider").style.display = "block";
                slider.style.width = '100%';
            } else {
                document.getElementById("angleSlider").style.display = "none";
                slider.style.width = '100%';
                angleSlider.style.display = 'none';
                angleSlider.value = 0;
                slider.style.transform = 'rotate(0deg)';
            }
        });
        
        slider.oninput = function() {
            speed = 0;
        };
        
        angleSlider.oninput = function() {
            angle = Number(angleSlider.value);
            slider.style.transform = 'rotate(' + angle + 'deg)';
        };
        
        document.getElementById("submit").addEventListener("click", function(event) {
            if (confirm("Is this your Phone Number?\n" + PhoneNumberToDisplay(value))) {
                alert("Phone number confirmed! Proceeding to ......");
                window.location.href = 'validation.html?next=password.html';
            } else {
                alert("Please adjust the slider to set your correct phone number!");
            }
            event.preventDefault();
        });
        
        phoneDisplay.innerHTML = PhoneNumberToDisplay(value);
    </script>
</body>
</html>
